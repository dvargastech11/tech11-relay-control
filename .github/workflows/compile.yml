name: Arduino CI Build Check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "arduino:avr:uno" # Or esp32:esp32:esp32, etc.
          sketch-paths: "./path/to/your/sketch"
          enable-submodules-provisioning: true
