<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password - Tech 11</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #262626;
      padding: 40px;
      border-radius: 10px;
      width: 320px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    .warning {
      background: #7a1f1f;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #eee;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #3d7cef;
    }
    .flash {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Set a New Password</h2>
    {% if forced %}
    <div class="warning">You must change the default password before continuing.</div>
    {% endif %}
    <form method="POST">
      <input type="password" name="newpass" placeholder="New Password" required minlength="8">
      <input type="password" name="confirmpass" placeholder="Confirm New Password" required minlength="8">
      <button type="submit">Update Password</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
