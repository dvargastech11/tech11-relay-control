{% extends "base.html" %}
{% block title %}Manage Buildings{% endblock %}
{% block content %}
  <h1>Manage Buildings</h1>

  <div style="max-width:500px; margin:0 auto; display:flex; flex-direction:column; gap:12px;">
    {% for b in buildings %}
      <a href="/admin/buildings/{{ b.id }}" style="display:block; background:#262626; color:#eee; text-decoration:none;
        padding:16px; border-radius:10px; font-weight:bold; text-align:left;">
        {{ b.name }}
        <div style="color:#888; font-weight:normal; font-size:13px; margin-top:4px;">
          {{ b.elevators|length }} elevator(s)
        </div>
      </a>
    {% endfor %}

    <a href="/admin/buildings/new" style="display:block; background:#2d6cdf; color:white; text-decoration:none;
      padding:16px; border-radius:10px; font-weight:bold; text-align:center;">
      + Add Building
    </a>
  </div>
{% endblock %}
